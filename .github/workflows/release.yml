name: Release

# Publish Linux + Raspberry Pi binaries on the GitHub Releases page.
# Usage: git tag v1.0.0 && git push origin v1.0.0
# (or run manually from the Actions tab to build without publishing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            slug: linux-amd64
            goarch: amd64
            goarm: ""
          - name: Raspberry Pi 64-bit (arm64)
            slug: linux-arm64
            goarch: arm64
            goarm: ""
          - name: Raspberry Pi 32-bit (armv7)
            slug: linux-armv7
            goarch: arm
            goarm: "7"
          - name: Raspberry Pi Zero/1 (armv6)
            slug: linux-armv6
            goarch: arm
            goarm: "6"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go vet ./... && go test -count=1 ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/echoblue-${version}-${{ matrix.slug }}" ./
          ls -lh dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: echoblue-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum echoblue-* > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/echoblue-*
            dist/SHA256SUMS
          generate_release_notes: true
